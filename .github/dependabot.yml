version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1 only.
      - dependency-name: typescript
        versions: [">= 7"]
      # ext-apps 2 needs the MCP TypeScript SDK 2 split packages; this server is on @modelcontextprotocol/sdk 1.
      - dependency-name: "@modelcontextprotocol/ext-apps"
        versions: [">= 2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
